<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dungeon Mode Kit - Minimal Test</title>
     <link rel="stylesheet" href="assets/main.css" type="text/css" media="screen" charset="utf-8">
</head>
<body>
    <div id="info">
        <h2>Dungeon Mode Kit</h2>
        <p>Status: <span id="status">Ready</span></p>
    </div>
    <div class="game-container">
        <div id="game">
        </div>
        <div class="text">
            <div id="actors" class="actor-list">
            </div>
            <div id="items" class="item-list">
            </div>
            <details id="description">
                <summary><strong>Description</strong></summary>
                The Description of the Dungeon
            </details> 
        </div>
          
    </div>
    <!-- Libraries -->
    <script src="lib/rot.js"></script>
    <script src="lib/pixi.min.js"></script>
    <script src="lib/tweenjs.js"></script>
    <script src="lib/howler.js"></script>
    <script src="globals.js"></script>
    <script src="architect.js"></script>
    <script src="lighting.js"></script>
    <script src="sound.js"></script>
    <script src="interface.js"></script>
    <script src="input.js"></script>
    <script src="effects.js"></script>
    <script src="engine.js"></script>
    <script src="behaviors.js"></script>
    

    <script>
        const statusEl = document.getElementById('status');
        
        function updateStatus(message, isError = false) {
            statusEl.textContent = message;
            statusEl.className = isError ? 'error' : 'success';
            console.log(message);
        }

        async function startTest() {
            try {
                updateStatus('Initializing engine...');
                await initializeGame();
                updateStatus('✓ Engine loaded! You should see a tile pattern below.');
            } catch (e) {
                updateStatus(`✗ Error: ${e.message}`, true);
                console.error(e);
            }
        }

        // Auto-start
        window.addEventListener('load', () => {
            setTimeout(startTest, 500);
        });
    </script>
</body>
</html>
