<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Effects Editor — Dungeon Mode Kit</title>
<link rel="stylesheet" href="../assets/main.css">
<!-- The preview runs the ENGINE's effects, not a copy of them: pixi + globals +
     effects.js are the same files the game loads, so what you see here is what
     the game does. Previously this page reimplemented the tint math in Canvas 2D
     and the two drifted. -->
<script src="../lib/pixi.min.js"></script>
<script src="../globals.js"></script>
<script src="../effects.js"></script>
<script src="scripts/tile-picker.js"></script>
<script src="scripts/effect-params.js"></script>
</head>
<body class="editor effects-editor">

<header>
    <h1>Effects Editor</h1>
    <label>Effect:
        <select id="effect-select" style="min-width:200px"></select>
    </label>
    <button id="btn-new">New Effect</button>
    <button id="btn-export" class="btn-accent">Export JSON</button>
    <button id="btn-copy" class="btn-accent">Copy to Clipboard</button>
</header>

<div id="workspace" class="workspace">
    <aside id="preview-panel" class="preview-panel">
        <h3>Preview</h3>
        <div id="preview-mount" class="preview-canvas"></div>
        <div class="field-row" style="margin-top:6px">
            <button id="btn-replay">Replay</button>
            <button id="btn-tick">Tick</button>
        </div>
        <div class="preview-label">Top</div>
        <div class="tile-slot" data-target="tileTop">
            <canvas width="80" height="60"></canvas>
            <span class="tile-name">—</span>
        </div>
        <div class="preview-label">Base</div>
        <div class="tile-slot" data-target="tileBase">
            <canvas width="80" height="60"></canvas>
            <span class="tile-name">—</span>
        </div>
        <div class="field-row" style="margin-top:8px">
            <label style="min-width:unset">Tint</label>
            <input type="color" id="f-preview-tint" value="#ffffff">
            <input type="text" id="f-preview-tint-hex" value="#ffffff" placeholder="#rrggbb" style="width:80px">
        </div>
        <div style="font-size:9px;color:var(--text-dim);margin-top:4px">Tint is for preview only. At runtime, each actor/item provides its own.</div>
    </aside>

    <div id="form-panel" class="form-panel">
        <!-- Effect Definition -->
        <details class="section" open>
            <summary>Effect Definition</summary>
            <div class="section-body">
                <div class="field-row">
                    <label>Key</label>
                    <input type="text" id="effect-key" placeholder="my_effect">
                </div>
                <div class="field-row">
                    <label>Target</label>
                    <select id="f-target">
                        <option value="sprite">sprite</option>
                        <option value="stage">stage</option>
                        <option value="scene">scene</option>
                        <option value="overlay">overlay</option>
                        <option value="actor_sprites">actor_sprites</option>
                    </select>
                </div>
            </div>
        </details>

        <!-- Layers -->
        <details class="section" open>
            <summary>Layers</summary>
            <div class="section-body">
                <div id="layers-container"></div>
                <button class="add-btn" id="btn-add-layer">+ Add Layer</button>
            </div>
        </details>

        <!-- Waveform Visualizer (visible when tint_cycle step layer exists) -->
        <details class="section" id="waveform-section">
            <summary>Waveform</summary>
            <div class="section-body">
                <canvas id="waveform-canvas" class="waveform-canvas" width="600" height="120"></canvas>
                <div class="timing-readout" id="timing-readout"></div>
            </div>
        </details>
    </div>
</div>

<div id="json-output-panel" class="json-output-panel">
    <div class="output-header">
        <h3>JSON Output</h3>
        <span id="effect-key-field"></span>
    </div>
    <textarea id="json-output" class="json-output" readonly rows="8"></textarea>
</div>

<!-- The tile picker injects its own markup on first open (scripts/tile-picker.js). -->

<script>
// ============================================================================
// Constants & State
// ============================================================================

let TILE_W = 40, TILE_H = 30, SS_COLS = 23, SS_ROWS = 17;
const SPRITESHEET_PATH = '../assets/sprites/static-tiles.png';
const TILE_DATA_PATH = '../data/static-tiles.json';
const EFFECTS_DATA_PATH = '../data/effects.json';

let state = {
    tileMap: {},
    reverseTileMap: {},
    tileNames: [],
    spritesheetImg: null,
    effects: {},
    currentTiles: { tileBase: 'WHITE_LEG', tileTop: 'OPAQUE_WHITE_SMILING_FACE' },
    activeTileTarget: null,
    highlightedTiles: null
};


// ============================================================================
// Primitive Parameter Registry
// ============================================================================

// PRIMITIVE_PARAMS (the slider schema) now lives in scripts/effect-params.js so
// the actor and item editors can read it too. The list of primitives itself comes
// from effects.js at runtime, so a new primitive is never silently missing here —
// which is what used to drop gradient_wave, hue_cycle and radial_gradient, and
// corrupt victory_wave / victory_radial on save.
const PRIMITIVE_NAMES = effectPrimitiveNames();

// ============================================================================
// Data Loading
// ============================================================================

async function fetchJSON(url) {
    try {
        const r = await fetch(url);
        if (!r.ok) return {};
        const text = await r.text();
        if (!text.trim()) return {};
        return JSON.parse(text);
    } catch { return {}; }
}

function loadSpritesheet() {
    return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
            state.spritesheetImg = img;
            SS_ROWS = Math.ceil(img.height / TILE_H);
            SS_COLS = Math.ceil(img.width / TILE_W);
            resolve();
        };
        img.onerror = () => resolve();
        img.src = SPRITESHEET_PATH;
    });
}

async function loadBaseData() {
    const [tilesData, effects] = await Promise.all([
        fetchJSON(TILE_DATA_PATH),
        fetchJSON(EFFECTS_DATA_PATH),
    ]);
    TILE_W = tilesData.tilePixelWidth || TILE_W;
    TILE_H = tilesData.tilePixelHeight || TILE_H;
    state.tileMap = tilesData.tiles || {};
    state.effects = effects;

    state.tileNames = Object.keys(state.tileMap).sort();
    state.reverseTileMap = {};
    for (const [name, coords] of Object.entries(state.tileMap)) {
        const key = coords[0] + ',' + coords[1];
        if (!state.reverseTileMap[key]) state.reverseTileMap[key] = [];
        state.reverseTileMap[key].push(name);
    }
}

// ============================================================================
// Tile Drawing
// ============================================================================

function resolveTile(ref) {
    if (!ref || ref === 'BLANK' || ref === 'NULL') return null;
    if (typeof ref === 'string') {
        const coords = state.tileMap[ref];
        if (!coords) return null;
        return { x: coords[0], y: coords[1] };
    }
    if (typeof ref === 'object' && ref.x !== undefined) return ref;
    return null;
}

function drawTileOnCanvas(canvas, tileRef, tintColor, flipH, flipV, scale) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    const coords = resolveTile(tileRef);
    if (!coords || !state.spritesheetImg) return;

    scale = scale || (w / TILE_W);
    const dw = TILE_W * scale, dh = TILE_H * scale;

    const offscreen = document.createElement('canvas');
    offscreen.width = TILE_W;
    offscreen.height = TILE_H;
    const octx = offscreen.getContext('2d');

    octx.drawImage(state.spritesheetImg, coords.x * TILE_W, coords.y * TILE_H, TILE_W, TILE_H, 0, 0, TILE_W, TILE_H);

    if (tintColor && tintColor !== '#ffffff') {
        octx.globalCompositeOperation = 'multiply';
        octx.fillStyle = tintColor;
        octx.fillRect(0, 0, TILE_W, TILE_H);
        octx.globalCompositeOperation = 'destination-in';
        octx.drawImage(state.spritesheetImg, coords.x * TILE_W, coords.y * TILE_H, TILE_W, TILE_H, 0, 0, TILE_W, TILE_H);
    }

    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(offscreen, 0, 0, TILE_W, TILE_H, (w - dw) / 2, (h - dh) / 2, dw, dh);
}

// ============================================================================
// tint_cycle Preview Math (mirrors effects.js)
// ============================================================================

function computeTintCycleWave(params, time) {
    const speed = params.speed ?? 0.002;
    const mod_speed = params.mod_speed ?? 0;
    const phase_factor = params.phase_factor ?? 0.618;
    const waveform = params.waveform ?? 'sine';
    const step_up = params.step_up ?? 0.33;
    const step_down = params.step_down ?? -0.33;
    const blend = params.blend ?? 0;

    const primary = Math.sin(time * speed);
    const mod = mod_speed > 0 ? (0.5 + 0.5 * Math.sin(time * mod_speed)) : 1.0;
    let wave = primary * mod;

    if (waveform === 'step') {
        if (blend > 0) {
            const hw = blend * 0.5;
            if (wave >= step_up + hw) wave = 1;
            else if (wave >= step_up - hw) wave = (wave - (step_up - hw)) / (2 * hw);
            else if (wave <= step_down - hw) wave = -1;
            else if (wave <= step_down + hw) wave = -((step_down + hw) - wave) / (2 * hw);
            else wave = 0;
        } else {
            if (wave > step_up) wave = 1;
            else if (wave < step_down) wave = -1;
            else wave = 0;
        }
    }
    return wave;
}

// ============================================================================
// PIXI Preview Harness
// ============================================================================

// The preview builds a miniature of what RenderSystem gives EffectRunner: the same
// container names, the same ctx keys (effects.js:1307), and real PIXI sprites. That
// lets us call the ENGINE's primitives instead of reimplementing them — the three
// hand-written copies of the tint math that used to live here disagreed with the
// engine and with each other.
//
// The scene is a PREVIEW_COLS x PREVIEW_ROWS floor grid with two actor sprites on
// top, which is enough for the map-flavoured primitives (floor_swap, tile_color_drift,
// radial_tile_fill) to have something to chew on.

const PREVIEW_COLS = 9, PREVIEW_ROWS = 7;

// texture_scramble calls randomElement, which lives in engine.js (and uses ROT.RNG)
// rather than in effects.js. Loading the whole engine here for one helper isn't worth
// it, so define it if it isn't already present — the preview doesn't need a seeded RNG.
if (typeof randomElement === 'undefined') {
    window.randomElement = arr => arr[Math.floor(Math.random() * arr.length)];
}

let pixiApp = null;
let previewRunner = null;
let previewHandle = 0;
let previewSprites = [];   // the actor sprites an effect with target:"sprite" attaches to
let previewFloorSprites = [];
let baseTexture = null;

/** Texture for one tile of the spritesheet, cut from the shared base texture. */
function tileTexture(tileRef) {
    const coords = resolveTile(tileRef);
    if (!coords || !baseTexture) return PIXI.Texture.EMPTY;
    return new PIXI.Texture(
        baseTexture,
        new PIXI.Rectangle(coords.x * TILE_W, coords.y * TILE_H, TILE_W, TILE_H)
    );
}

/**
 * Stand-in for RenderSystem. EffectRunner only reads a handful of fields off the
 * renderer, and the sprite-tint primitives additionally use it as a scratch pad for
 * their shared ticker state (`_tintFlickerSprites` and friends), which they create
 * themselves — so an empty object with the right shape is enough.
 */
function buildPreviewRenderer() {
    const app = pixiApp;
    const containers = {
        background: new PIXI.Container(),
        floor: new PIXI.Container(),
        entity: new PIXI.Container(),
        darkness: new PIXI.Container(),
        ui: new PIXI.Container()
    };
    for (const c of Object.values(containers)) app.stage.addChild(c);

    // A synthetic engine: the viewport/background fields the stage-wide primitives
    // read (canvas_flash, color_overlay, tile_color_drift), plus the entityManager
    // texture_scramble walks. That one bails at `if (!actors) return` rather than
    // throwing, so without this the effect previewed as nothing at all.
    const fakeEngine = {
        viewportEnabled: false,
        viewportWidth: PREVIEW_COLS,
        viewportHeight: PREVIEW_ROWS,
        sectionOriginX: 0,
        sectionOriginY: 0,
        config: { backgroundColor: '#222222' },
        // The preview sprites, dressed as the actors/items texture_scramble expects.
        // Rebuilt whenever the sprites are (see rebuildPreviewSprites).
        entityManager: { actors: [], items: [] },
        spriteLibrary: {
            // floor_swap wants coordinates; texture_scramble wants the name too, so
            // it can write the false tile name the sidebar would read.
            getRandomTileIndex() {
                const t = this.getRandomTile();
                return { x: t.x, y: t.y };
            },
            getRandomTile() {
                const names = state.tileNames;
                if (!names.length) return { name: 'something', x: 0, y: 0 };
                const name = names[Math.floor(Math.random() * names.length)];
                const c = state.tileMap[name];
                return { name, x: c[0], y: c[1] };
            }
        }
    };

    return {
        app,
        backgroundContainer: containers.background,
        floorContainer: containers.floor,
        entityContainer: containers.entity,
        darknessContainer: containers.darkness,
        uiContainer: containers.ui,
        engine: fakeEngine,
        floorSprites: previewFloorSprites,
        mapWidth: PREVIEW_COLS,
        mapHeight: PREVIEW_ROWS,

        // Shared per-primitive ticker state. Most primitives create these lazily,
        // but tint_cycle assumes RenderSystem already made them (engine.js:14159)
        // and throws otherwise, so mirror what the constructor sets up.
        _tintCycleSprites: [],
        _tintCycleTickerFn: null,
        _tintFlickerSprites: [],
        _tintFlickerTickerFn: null,
        submersionOverlay: null,
        // floor_swap calls this to repaint a floor tile.
        updateSpriteTexture(sprite, tileIndex) {
            sprite.texture = tileTexture(tileIndex);
        }
    };
}

/** Build the PIXI app, the floor grid and the two actor sprites. Runs once. */
function initPreview() {
    const mount = document.getElementById('preview-mount');
    const w = PREVIEW_COLS * TILE_W, h = PREVIEW_ROWS * TILE_H;

    pixiApp = new PIXI.Application({
        width: w, height: h,
        backgroundColor: 0x222222,
        antialias: false
    });
    // PIXI v7 exposes `.view`; v8 renames it to `.canvas`.
    const view = pixiApp.canvas || pixiApp.view;
    view.style.width = (w / 2) + 'px';
    view.style.height = (h / 2) + 'px';
    mount.appendChild(view);

    baseTexture = PIXI.BaseTexture ? PIXI.BaseTexture.from(SPRITESHEET_PATH)
                                   : PIXI.Texture.from(SPRITESHEET_PATH);
    if (baseTexture.scaleMode !== undefined) baseTexture.scaleMode = PIXI.SCALE_MODES?.NEAREST ?? 0;

    const renderer = buildPreviewRenderer();

    // Floor grid — a dim tile so effects that touch the floor are visible.
    previewFloorSprites.length = 0;
    for (let y = 0; y < PREVIEW_ROWS; y++) {
        const row = [];
        for (let x = 0; x < PREVIEW_COLS; x++) {
            const s = new PIXI.Sprite(tileTexture('LIGHT_SHADE_QUADRANT_LOWER_LEFT_AND_UPPER_RIGHT'));
            s.x = x * TILE_W;
            s.y = y * TILE_H;
            s.tint = 0x555555;
            renderer.floorContainer.addChild(s);
            row.push(s);
        }
        previewFloorSprites.push(row);
    }

    previewRunner = new EffectRunner(renderer);
    rebuildPreviewSprites();
}

/** (Re)create the two actor sprites from the current tile slots and preview tint. */
function rebuildPreviewSprites() {
    if (!previewRunner) return;
    const entity = previewRunner.ctx.containers.entity;
    for (const s of previewSprites) entity.removeChild(s);
    previewSprites = [];

    const tint = parseInt(document.getElementById('f-preview-tint').value.slice(1), 16);
    const cx = Math.floor(PREVIEW_COLS / 2) * TILE_W;
    const cy = Math.floor(PREVIEW_ROWS / 2) * TILE_H;

    // Two sprites, not one: the engine gives each a random phase, so a correct
    // preview shows them drifting apart. The old single shared state couldn't.
    const slots = [
        { ref: state.currentTiles.tileTop, x: cx, y: cy - TILE_H },
        { ref: state.currentTiles.tileBase, x: cx, y: cy }
    ];
    for (const slot of slots) {
        if (!resolveTile(slot.ref)) continue;
        const s = new PIXI.Sprite(tileTexture(slot.ref));
        s.x = slot.x;
        s.y = slot.y;
        s.tint = tint;
        entity.addChild(s);
        previewSprites.push(s);
    }

    // Present the same sprites as the entity lists texture_scramble walks: one actor
    // wearing both tiles (base + top, the way a two-tile creature does) and one item.
    // `skip_player` is the primitive's default, so isPlayerControlled must say no or
    // the actor is skipped and the effect looks broken.
    const em = previewRunner.ctx.engine.entityManager;
    em.actors = previewSprites.length ? [{
        isDead: false,
        isPlayerControlled: () => false,
        spriteBase: previewSprites[previewSprites.length - 1],
        spriteTop: previewSprites.length > 1 ? previewSprites[0] : null
    }] : [];
    em.items = [];
}

/**
 * Tear down the running effect and apply the one currently in the form.
 * This is the whole preview: no local math, just EffectRunner on real sprites.
 */
function renderPreview() {
    if (!previewRunner) return;

    if (previewHandle) {
        previewRunner.remove(previewHandle);
        previewHandle = 0;
    }
    // Reset anything a previous effect left on the stage or the sprites.
    pixiApp.stage.filters = null;
    pixiApp.stage.x = 0;
    pixiApp.stage.y = 0;
    rebuildPreviewSprites();

    const key = document.getElementById('effect-key').value || '_preview';
    const definition = readForm();
    if (!definition.layers && !definition.on_tick) return;

    previewRunner.loadEffects({ [key]: definition });

    const tint = parseInt(document.getElementById('f-preview-tint').value.slice(1), 16);
    // line_tile_fill needs a path, which only combat produces at runtime.
    const path = [];
    for (let x = 0; x < PREVIEW_COLS; x++) path.push({ x, y: Math.floor(PREVIEW_ROWS / 2) });

    const target = definition.target === 'sprite' ? previewSprites[0] : null;
    previewHandle = previewRunner.apply(key, target, { baseTint: tint, path, tint });

    // A target:"sprite" effect attaches to one sprite per apply(); give the second
    // its own so the phase offset is visible.
    if (definition.target === 'sprite' && previewSprites[1]) {
        previewRunner.apply(key, previewSprites[1], { baseTint: tint, path, tint });
    }
}

function renderWaveform() {
    const canvas = document.getElementById('waveform-canvas');
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, w, h);

    const params = getFirstTintCycleParams();
    if (!params) return;

    const speed = params.speed ?? 0.002;
    const period = (2 * Math.PI) / speed;
    const midY = h / 2;
    const ampPx = (h / 2) - 8;

    // Draw zero line
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, midY);
    ctx.lineTo(w, midY);
    ctx.stroke();

    // Draw threshold lines (for step waveform)
    if (params.waveform === 'step') {
        const su = params.step_up ?? 0.33;
        const sd = params.step_down ?? -0.33;
        ctx.strokeStyle = 'rgba(255,200,100,0.3)';
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(0, midY - su * ampPx);
        ctx.lineTo(w, midY - su * ampPx);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(100,150,255,0.3)';
        ctx.beginPath();
        ctx.moveTo(0, midY - sd * ampPx);
        ctx.lineTo(w, midY - sd * ampPx);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    // Draw raw sine (faint)
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x < w; x++) {
        const t = (x / w) * period;
        const rawSine = Math.sin(t * speed);
        const mod = (params.mod_speed ?? 0) > 0
            ? (0.5 + 0.5 * Math.sin(t * (params.mod_speed ?? 0)))
            : 1.0;
        const raw = rawSine * mod;
        const y = midY - raw * ampPx;
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // Draw processed waveform (bright)
    ctx.strokeStyle = '#0f8';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let x = 0; x < w; x++) {
        const t = (x / w) * period;
        const wave = computeTintCycleWave(params, t);
        const y = midY - wave * ampPx;
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // Fill colored regions for step waveform
    if (params.waveform === 'step') {
        ctx.globalAlpha = 0.08;
        for (let x = 0; x < w; x++) {
            const t = (x / w) * period;
            const wave = computeTintCycleWave(params, t);
            if (wave > 0.5) {
                ctx.fillStyle = '#ffcc44';
                ctx.fillRect(x, 0, 1, h);
            } else if (wave < -0.5) {
                ctx.fillStyle = '#4488ff';
                ctx.fillRect(x, 0, 1, h);
            }
        }
        ctx.globalAlpha = 1;
    }
}

function updateTimingReadout() {
    const el = document.getElementById('timing-readout');
    const params = getFirstTintCycleParams();
    if (!params || params.waveform !== 'step') {
        el.textContent = '';
        return;
    }
    const su = params.step_up ?? 0.33;
    const sd = Math.abs(params.step_down ?? -0.33);
    const lighterPct = (Math.PI - 2 * Math.asin(Math.min(1, su))) / (2 * Math.PI) * 100;
    const darkerPct = (Math.PI - 2 * Math.asin(Math.min(1, sd))) / (2 * Math.PI) * 100;
    const basePct = Math.max(0, 100 - lighterPct - darkerPct);
    el.innerHTML =
        `<span class="timing-lighter">Lighter: ${lighterPct.toFixed(1)}%</span>` +
        `<span class="timing-base">Base: ${basePct.toFixed(1)}%</span>` +
        `<span class="timing-darker">Darker: ${darkerPct.toFixed(1)}%</span>`;
}

// ============================================================================
// Layer Management
// ============================================================================

let layerCount = 0;

function getFirstTintParams() {
    const container = document.getElementById('layers-container');
    for (const item of container.children) {
        const sel = item.querySelector('.layer-primitive-select');
        if (sel && (sel.value === 'tint_cycle' || sel.value === 'tint_flicker')) {
            return { primitive: sel.value, params: readLayerParams(item) };
        }
    }
    return null;
}

function getFirstTintCycleParams() {
    const result = getFirstTintParams();
    return (result && result.primitive === 'tint_cycle') ? result.params : null;
}

function readLayerParams(layerEl) {
    const params = {};
    const primitiveName = layerEl.querySelector('.layer-primitive-select').value;
    const paramDefs = PRIMITIVE_PARAMS[primitiveName] || [];
    for (const def of paramDefs) {
        const input = layerEl.querySelector(`[data-param-key="${def.key}"]`);
        if (!input) continue;
        if (def.type === 'checkbox') {
            params[def.key] = input.checked;
        } else if (def.type === 'range') {
            params[def.key] = parseFloat(input.value);
        } else {
            params[def.key] = input.value;
        }
    }
    return params;
}

function addLayer(primitiveName, existingParams) {
    primitiveName = primitiveName || 'tint_cycle';
    existingParams = existingParams || {};

    const container = document.getElementById('layers-container');
    const layerId = 'layer-' + (layerCount++);

    const item = document.createElement('div');
    item.className = 'layer-item';
    item.id = layerId;

    const header = document.createElement('div');
    header.className = 'layer-header';

    const sel = document.createElement('select');
    sel.className = 'layer-primitive-select';
    for (const name of PRIMITIVE_NAMES) {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        sel.appendChild(opt);
    }
    sel.value = primitiveName;

    const removeBtn = document.createElement('button');
    removeBtn.className = 'remove-btn';
    removeBtn.textContent = 'Remove';
    removeBtn.addEventListener('click', () => {
        item.remove();
        updateAll();
    });

    header.appendChild(sel);
    header.appendChild(removeBtn);
    item.appendChild(header);

    const paramsDiv = document.createElement('div');
    paramsDiv.className = 'layer-params';
    item.appendChild(paramsDiv);

    sel.addEventListener('change', () => {
        buildParamFields(paramsDiv, sel.value, {});
        updateAll();
    });

    container.appendChild(item);
    buildParamFields(paramsDiv, primitiveName, existingParams);
    return item;
}

function buildParamFields(container, primitiveName, existingParams) {
    container.innerHTML = '';
    const paramDefs = PRIMITIVE_PARAMS[primitiveName] || [];

    if (paramDefs.length === 0) {
        container.innerHTML = '<div class="empty-hint">No configurable parameters</div>';
        return;
    }

    for (const def of paramDefs) {
        const val = existingParams[def.key] !== undefined ? existingParams[def.key] : def.default;

        const row = document.createElement('div');
        row.className = 'field-row';
        if (def.showWhen) row.dataset.showWhen = JSON.stringify(def.showWhen);

        const label = document.createElement('label');
        label.textContent = def.label || def.key;
        row.appendChild(label);

        if (def.type === 'range') {
            const rangeWrap = document.createElement('div');
            rangeWrap.className = 'range-pair';

            const range = document.createElement('input');
            range.type = 'range';
            range.min = def.min;
            range.max = def.max;
            range.step = def.step;
            range.value = val;
            range.dataset.paramKey = def.key;

            const num = document.createElement('input');
            num.type = 'number';
            num.min = def.min;
            num.max = def.max;
            num.step = def.step;
            num.value = val;

            range.addEventListener('input', () => {
                num.value = range.value;
                onParamChange(container);
            });
            num.addEventListener('input', () => {
                range.value = num.value;
                onParamChange(container);
            });

            rangeWrap.appendChild(range);
            rangeWrap.appendChild(num);
            row.appendChild(rangeWrap);
        } else if (def.type === 'hex') {
            const hexInput = document.createElement('input');
            hexInput.type = 'text';
            hexInput.value = val;
            hexInput.style.width = '100px';
            hexInput.style.flex = '0';
            hexInput.dataset.paramKey = def.key;
            hexInput.addEventListener('input', () => {
                onParamChange(container);
                if (colorSwatch) {
                    const hex = hexInput.value.replace('0x', '#');
                    colorSwatch.value = hex.length === 7 ? hex : colorSwatch.value;
                }
                if (def.expandRGB) updateRGBFromHex(hexInput, container);
            });

            const colorSwatch = document.createElement('input');
            colorSwatch.type = 'color';
            const hexForColor = val.replace('0x', '#');
            colorSwatch.value = hexForColor.length === 7 ? hexForColor : '#000000';
            colorSwatch.addEventListener('input', () => {
                hexInput.value = '0x' + colorSwatch.value.slice(1);
                onParamChange(container);
                if (def.expandRGB) updateRGBFromHex(hexInput, container);
            });

            row.appendChild(hexInput);
            row.appendChild(colorSwatch);

            if (def.expandRGB) {
                const toggleBtn = document.createElement('button');
                toggleBtn.className = 'add-btn';
                toggleBtn.textContent = 'R/G/B';
                toggleBtn.style.marginLeft = '4px';
                toggleBtn.addEventListener('click', () => {
                    const breakdown = container.querySelector(`.cv-breakdown[data-for="${def.key}"]`);
                    if (breakdown) breakdown.classList.toggle('visible');
                });
                row.appendChild(toggleBtn);
            }

            container.appendChild(row);

            if (def.expandRGB) {
                const breakdown = document.createElement('div');
                breakdown.className = 'cv-breakdown';
                breakdown.dataset.for = def.key;
                const cv = typeof val === 'string' ? parseInt(val, 16) : val;
                for (const [ch, shift] of [['R', 16], ['G', 8], ['B', 0]]) {
                    const chRow = document.createElement('div');
                    chRow.className = 'field-row';
                    const chLabel = document.createElement('label');
                    chLabel.textContent = ch;
                    chLabel.style.minWidth = '20px';

                    const chRange = document.createElement('input');
                    chRange.type = 'range';
                    chRange.min = 0;
                    chRange.max = 255;
                    chRange.step = 1;
                    chRange.value = (cv >> shift) & 0xFF;
                    chRange.dataset.rgbChannel = ch;
                    chRange.style.flex = '1';

                    const chNum = document.createElement('input');
                    chNum.type = 'number';
                    chNum.min = 0;
                    chNum.max = 255;
                    chNum.value = chRange.value;
                    chNum.style.width = '60px';

                    chRange.addEventListener('input', () => {
                        chNum.value = chRange.value;
                        updateHexFromRGB(hexInput, container, def.key);
                        if (colorSwatch) colorSwatch.value = hexInput.value.replace('0x', '#');
                        onParamChange(container);
                    });
                    chNum.addEventListener('input', () => {
                        chRange.value = chNum.value;
                        updateHexFromRGB(hexInput, container, def.key);
                        if (colorSwatch) colorSwatch.value = hexInput.value.replace('0x', '#');
                        onParamChange(container);
                    });

                    chRow.appendChild(chLabel);
                    const rp = document.createElement('div');
                    rp.className = 'range-pair';
                    rp.appendChild(chRange);
                    rp.appendChild(chNum);
                    chRow.appendChild(rp);
                    breakdown.appendChild(chRow);
                }
                container.appendChild(breakdown);
            }
            continue;
        } else if (def.type === 'select') {
            const select = document.createElement('select');
            select.dataset.paramKey = def.key;
            for (const opt of def.options) {
                const o = document.createElement('option');
                o.value = opt;
                o.textContent = opt;
                select.appendChild(o);
            }
            select.value = val;
            select.addEventListener('change', () => onParamChange(container));
            row.appendChild(select);
        } else if (def.type === 'checkbox') {
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.checked = !!val;
            cb.dataset.paramKey = def.key;
            cb.addEventListener('change', () => onParamChange(container));
            row.appendChild(cb);
        }

        container.appendChild(row);
    }

    updateConditionalFields(container);
}

function updateRGBFromHex(hexInput, container) {
    const key = hexInput.dataset.paramKey;
    const breakdown = container.querySelector(`.cv-breakdown[data-for="${key}"]`);
    if (!breakdown) return;
    const cv = parseInt(hexInput.value.replace('0x', '').replace('#', ''), 16) || 0;
    const channels = breakdown.querySelectorAll('[data-rgb-channel]');
    for (const ch of channels) {
        const shift = ch.dataset.rgbChannel === 'R' ? 16 : ch.dataset.rgbChannel === 'G' ? 8 : 0;
        const val = (cv >> shift) & 0xFF;
        ch.value = val;
        const numSibling = ch.parentElement.querySelector('input[type="number"]');
        if (numSibling) numSibling.value = val;
    }
}

function updateHexFromRGB(hexInput, container, key) {
    const breakdown = container.querySelector(`.cv-breakdown[data-for="${key}"]`);
    if (!breakdown) return;
    const channels = breakdown.querySelectorAll('[data-rgb-channel]');
    let r = 0, g = 0, b = 0;
    for (const ch of channels) {
        const v = parseInt(ch.value) || 0;
        if (ch.dataset.rgbChannel === 'R') r = v;
        else if (ch.dataset.rgbChannel === 'G') g = v;
        else b = v;
    }
    hexInput.value = '0x' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}

function onParamChange(paramsContainer) {
    updateConditionalFields(paramsContainer);
    updateAll();
}

function updateConditionalFields(container) {
    const rows = container.querySelectorAll('.field-row[data-show-when]');
    for (const row of rows) {
        const cond = JSON.parse(row.dataset.showWhen);
        let visible = true;
        for (const [key, expected] of Object.entries(cond)) {
            const input = container.querySelector(`[data-param-key="${key}"]`);
            if (input && input.value !== expected) visible = false;
        }
        row.style.display = visible ? '' : 'none';
    }
}

// ============================================================================
// Form Population & Reading
// ============================================================================

function populateEffectDropdown() {
    const sel = document.getElementById('effect-select');
    sel.innerHTML = '';
    for (const key of Object.keys(state.effects).sort()) {
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = key;
        sel.appendChild(opt);
    }
}

// Definition-level keys the form models. Anything else on the effect (on_tick,
// duration_ms) is held here across a load/save so the editor can't quietly delete
// the parts of an effect it doesn't have widgets for — it used to drop `on_tick`
// from `hallucination` and `duration_ms` from `flash`.
const MODELLED_EFFECT_KEYS = new Set(['target', 'layers']);
let unmodelledEffectKeys = {};
// Per-layer params with no schema entry, kept by layer index for the same reason.
let unmodelledLayerParams = [];
// Per-layer set of param keys the loaded file stated explicitly. readForm otherwise
// drops any value equal to the schema default, which silently deleted params that
// were written down deliberately — `"speed": 0.002` on ripple_tint, every `color`
// that matched, and so on.
let statedLayerParams = [];

function loadEffect(key) {
    const data = state.effects[key];
    if (!data) return;

    document.getElementById('effect-key').value = key;
    document.getElementById('f-target').value = data.target || 'sprite';

    unmodelledEffectKeys = {};
    for (const [k, v] of Object.entries(data)) {
        if (!MODELLED_EFFECT_KEYS.has(k)) unmodelledEffectKeys[k] = v;
    }

    const container = document.getElementById('layers-container');
    container.innerHTML = '';
    layerCount = 0;
    unmodelledLayerParams = [];
    statedLayerParams = [];

    if (data.layers) {
        for (const layer of data.layers) {
            const params = layer.params || {};
            const known = new Set((PRIMITIVE_PARAMS[layer.primitive] || []).map(d => d.key));
            const extra = {};
            for (const [k, v] of Object.entries(params)) {
                if (!known.has(k)) extra[k] = v;
            }
            unmodelledLayerParams.push(extra);
            // Which keys the file actually spelled out — see readForm.
            statedLayerParams.push(new Set(Object.keys(params)));
            addLayer(layer.primitive, params);
        }
    }

    updateAll();
    startAnimLoop();
}

function readForm() {
    const obj = {};
    obj.target = document.getElementById('f-target').value;

    const container = document.getElementById('layers-container');
    const layers = [];
    for (const item of container.children) {
        const sel = item.querySelector('.layer-primitive-select');
        if (!sel) continue;
        const primitiveName = sel.value;
        const params = readLayerParams(item);

        // Include a param if it differs from the default OR if the file we loaded
        // stated it. Dropping "same as default" keeps hand-written JSON terse, but
        // doing it to a value the author wrote down is data loss, not tidying.
        const paramDefs = PRIMITIVE_PARAMS[primitiveName] || [];
        const stated = statedLayerParams[layers.length];
        const cleanParams = {};
        for (const def of paramDefs) {
            if (params[def.key] === undefined) continue;
            if (params[def.key] !== def.default || stated?.has(def.key)) {
                cleanParams[def.key] = params[def.key];
            }
        }

        // Re-attach params this editor has no widget for, so they survive the trip.
        Object.assign(cleanParams, unmodelledLayerParams[layers.length] || {});

        const layer = { primitive: primitiveName };
        if (Object.keys(cleanParams).length > 0) layer.params = cleanParams;
        layers.push(layer);
    }

    if (layers.length) obj.layers = layers;
    // Definition-level keys the form doesn't model (on_tick, duration_ms).
    Object.assign(obj, unmodelledEffectKeys);
    return obj;
}

function updateJSONOutput() {
    const key = document.getElementById('effect-key').value || 'new_effect';
    const obj = readForm();
    document.getElementById('effect-key-field').textContent = key;
    document.getElementById('json-output').textContent = JSON.stringify({ [key]: obj }, null, 2);
}

// ============================================================================
// Animation Loop
// ============================================================================

// PIXI's own ticker drives the effect now, so there is no per-frame work for the
// page to do — renderPreview() re-applies the effect only when the form changes.
// These remain as no-ops because loadEffect and the buttons still call them.
function startAnimLoop() {}
function stopAnimLoop() {}

function updateAll() {
    renderPreview();
    renderWaveform();
    updateTimingReadout();
    updateJSONOutput();

    // The waveform graph only means anything for tint_cycle's wave.
    const hasCycle = getFirstTintCycleParams() !== null;
    document.getElementById('waveform-section').style.display = hasCycle ? '' : 'none';
}

// ============================================================================
// Tile Slot
// ============================================================================

function updateTileSlot(target) {
    const slot = document.querySelector(`.tile-slot[data-target="${target}"]`);
    if (!slot) return;
    const canvas = slot.querySelector('canvas');
    const nameSpan = slot.querySelector('.tile-name');
    const tileRef = state.currentTiles[target];
    if (!tileRef) {
        canvas.getContext('2d').clearRect(0, 0, 80, 60);
        nameSpan.textContent = '—';
        return;
    }
    drawTileOnCanvas(canvas, tileRef, null, false, false, 1);
    nameSpan.textContent = typeof tileRef === 'string' ? tileRef : `{${tileRef.x}, ${tileRef.y}}`;
}

// ============================================================================
// Tile Picker
// ============================================================================

// The searchable spritesheet grid lives in scripts/tile-picker.js; this page used
// to carry its own copy of it.
function openTilePicker(target) {
    TilePicker.open({
        current: state.currentTiles[target],
        label: target === 'tileTop' ? 'Top tile' : 'Base tile',
        onPick(value) {
            state.currentTiles[target] = value;
            updateTileSlot(target);
            renderPreview();
        }
    });
}

// ============================================================================
// Initialization
// ============================================================================

async function init() {
    await Promise.all([loadBaseData(), loadSpritesheet(), TilePicker.load()]);

    // Report any primitive effects.js ships that has no slider schema, so the two
    // lists can't drift apart silently again.
    warnMissingEffectParams();

    initPreview();
    populateEffectDropdown();
    updateTileSlot('tileBase');
    updateTileSlot('tileTop');

    // Wire tile slot clicks
    document.querySelector('.tile-slot[data-target="tileBase"]').addEventListener('click', () => {
        openTilePicker('tileBase');
    });
    document.querySelector('.tile-slot[data-target="tileTop"]').addEventListener('click', () => {
        openTilePicker('tileTop');
    });

    // Wire effect select
    document.getElementById('effect-select').addEventListener('change', () => {
        loadEffect(document.getElementById('effect-select').value);
    });

    // Wire buttons
    document.getElementById('btn-new').addEventListener('click', () => {
        document.getElementById('effect-key').value = 'new_effect';
        document.getElementById('f-target').value = 'sprite';
        document.getElementById('layers-container').innerHTML = '';
        layerCount = 0;
        addLayer('tint_cycle', {});
        updateAll();
        startAnimLoop();
    });

    // One-shot effects (canvas_flash, screen_shake, shatter) finish before you can
    // look at them, so give them a re-trigger. Tick drives `on_tick` primitives,
    // which the engine advances once per game turn.
    document.getElementById('btn-replay').addEventListener('click', renderPreview);
    document.getElementById('btn-tick').addEventListener('click', () => {
        if (previewHandle) previewRunner.tick(previewHandle);
    });

    document.getElementById('btn-add-layer').addEventListener('click', () => {
        addLayer('tint_cycle', {});
        updateAll();
    });

    document.getElementById('btn-export').addEventListener('click', updateJSONOutput);
    document.getElementById('btn-copy').addEventListener('click', () => {
        const text = document.getElementById('json-output').textContent;
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.getElementById('btn-copy');
            btn.textContent = 'Copied!';
            setTimeout(() => { btn.textContent = 'Copy to Clipboard'; }, 1200);
        });
    });

    // Wire tint color picker sync
    const tintColor = document.getElementById('f-preview-tint');
    const tintHex = document.getElementById('f-preview-tint-hex');
    tintColor.addEventListener('input', () => { tintHex.value = tintColor.value; updateAll(); });
    tintHex.addEventListener('input', () => {
        if (/^#[0-9a-fA-F]{6}$/.test(tintHex.value)) tintColor.value = tintHex.value;
        updateAll();
    });

    // Wire form inputs to updateAll
    document.getElementById('effect-key').addEventListener('input', updateJSONOutput);
    document.getElementById('f-target').addEventListener('change', updateAll);

    // Load first effect
    const keys = Object.keys(state.effects).sort();
    if (keys.length) {
        document.getElementById('effect-select').value = keys[0];
        loadEffect(keys[0]);
    }
}

init();
</script>
